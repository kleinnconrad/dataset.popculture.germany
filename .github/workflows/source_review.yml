name: Source Review
run-name: Source review (${{ inputs.probe != '' && 'probe' || 'review' }})

on:
  schedule:
    # First day of every month, 07:17 Berlin time; GitHub delays schedules at the full hour
    - cron: '17 7 1 * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Space-separated URLs to probe with the fetch rules instead of the review (robots.txt, TDM reservation, response, feed items, page links, imprint); the report goes to the job summary'
        type: string
        required: false
        default: ''
      pull_request:
        description: 'Open a pull request with the proposed changes; off writes the report to the job summary only'
        type: boolean
        default: true

concurrency:
  group: source-review
  cancel-in-progress: false

jobs:
  review-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Starts the CI workflow on the review branch
      actions: write
    env:
      PROBE: ${{ inputs.probe }}
      PULL_REQUEST: ${{ (github.event_name == 'workflow_dispatch' && inputs.pull_request == false) && 'off' || 'on' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: uv sync --frozen

    - name: Probe URLs
      if: env.PROBE != ''
      run: |
        read -r -a urls <<< "$PROBE"
        uv run python src/source_review.py --report "$RUNNER_TEMP/probe.md" --probe "${urls[@]}"
        cat "$RUNNER_TEMP/probe.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Review Sources
      if: env.PROBE == ''
      run: |
        uv run python src/source_review.py --report "$RUNNER_TEMP/source_review.md" --output-dir data
        cat "$RUNNER_TEMP/source_review.md" >> "$GITHUB_STEP_SUMMARY"

    # One review pull request at a time: the branch is rebuilt from the base branch every month
    - name: Open or Update Pull Request
      if: env.PROBE == '' && env.PULL_REQUEST == 'on'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE: ${{ github.ref_name }}
        OWNER: ${{ github.repository_owner }}
      run: |
        if git diff --quiet -- config/sources.toml; then
          echo "The review proposes no changes."
          exit 0
        fi
        month=$(date -u +%Y-%m)
        branch="source-review"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git switch -C "$branch"
        git add config/sources.toml
        git commit -m "chore(sources): source review $month"
        git push --force origin "$branch"
        { echo "@$OWNER"; echo; cat "$RUNNER_TEMP/source_review.md"; } > "$RUNNER_TEMP/pr_body.md"
        number=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
        if [ -n "$number" ]; then
          gh pr edit "$number" --title "Source review $month" --body-file "$RUNNER_TEMP/pr_body.md"
        else
          gh pr create --base "$BASE" --head "$branch" --title "Source review $month" \
            --body-file "$RUNNER_TEMP/pr_body.md"
        fi
        # Pull requests opened with the GITHUB_TOKEN start no workflows; the checks are started here
        gh workflow run ci.yml --ref "$branch"
