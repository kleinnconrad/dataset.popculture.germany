# Charts and rankings observed by the pipeline (collector `charts`).
#
# [[provider]]: an organization that publishes charts; `license` is copied into the field `license`
#   of every record of its charts.
# [[chart]]: one list. `format` names the parser in src/collectors/charts.py; `period` is live (the
#   source shows only its current list) or day (the source publishes a list per day, the address
#   contains {year}, {month} and {day}). `respect_robots = false` only for documented APIs.
#   `expect` is a regular expression that the title of the list at the source must match.
# [[excluded]]: candidates that were considered and not admitted, with the day and the reason.
#
# Ids are permanent. A chart that is no longer collected keeps its entry with `removed` and
# `removed_reason`; a new or changed address is checked with the probe of source_review.yml first.

# =============================================================================
# Providers
# =============================================================================

# RSS Builder of Apple Marketing Tools: generates feeds of the Apple charts per storefront; the page
# states the copyright of Apple Inc. and no further terms. The Apple terms page was not reachable
# from the development environment on 2026-10-28.
[[provider]]
id = "apple"
name = "Apple (RSS Builder of Apple Marketing Tools)"
homepage = "https://rss.marketingtools.apple.com/"
terms_url = "https://www.apple.com/legal/internet-services/terms/site.html"
license = "Copyright Apple Inc.; chart positions and metadata only"
added = 2026-10-28

# Google Trends links its terms (policies.google.com/terms); the terms permit automated access that
# follows the machine-readable instructions of the pages (robots.txt).
[[provider]]
id = "google_trends"
name = "Google Trends"
homepage = "https://trends.google.com/trending?geo=DE"
terms_url = "https://policies.google.com/terms"
license = "Google Terms of Service; search terms and approximate volumes as published"
added = 2026-10-28

[[provider]]
id = "wikimedia"
name = "Wikimedia Foundation (Pageviews API)"
homepage = "https://wikimedia.org/api/rest_v1/"
terms_url = "https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use"
license = "CC0-1.0"
added = 2026-10-28

