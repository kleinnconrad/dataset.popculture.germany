# Documented API (Wikimedia REST API, CC0). The format is the one of the Pageviews API that
# dataset.politics.germany and dataset.technology use; the development environment received
# HTTP 403 and 429 from Wikimedia on 2026-10-28, so the first run is the live check.
[[chart]]
id = "wikimedia.top_articles_dewiki"
name = "German Wikipedia: most viewed articles per day"
provider = "wikimedia"
domain = "attention"
format = "wikimedia_top"
url = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top/de.wikipedia.org/all-access/{year}/{month}/{day}"
period = "day"
entry_kind = "article"
metric_name = "views"
respect_robots = false
history_days = 30
options = { project = "de.wikipedia" }
added = 2026-10-28

# Documented API (Wikimedia REST API, CC0): articles of all editions viewed most from Germany; views
# are rounded up to the next thousand and listed only above a privacy threshold
[[chart]]
id = "wikimedia.top_articles_germany"
name = "Wikipedia: most viewed articles from Germany per day, all editions"
provider = "wikimedia"
domain = "attention"
format = "wikimedia_top_country"
url = "https://wikimedia.org/api/rest_v1/metrics/pageviews/top-per-country/DE/all-access/{year}/{month}/{day}"
country = "DE"
period = "day"
entry_kind = "article"
metric_name = "views, rounded up to the next thousand"
respect_robots = false
history_days = 30
added = 2026-10-28

