# Entities whose attention the pipeline measures with the daily views of their German Wikipedia
# articles (collector `wikipedia_pageviews`, the stable backbone of the dataset).
#
# type: see schema.EntityType; domain: see schema.PopDomain; wikipedia: title of the article on
# de.wikipedia.org. Concepts such as marriage, the Bundeswehr or veganism are the topics on which the
# annotation records the opinions of pop culture media (schema.StanceTarget).
#
# Every title was resolved through the MediaWiki API on 2026-10-28 (an existing article, not a
# disambiguation page; redirects replaced by their target). Ids are permanent; an entity that is no
# longer collected keeps its entry with `removed` and `removed_reason`. A new entity gets the daily
# views since 2015-07-01.

