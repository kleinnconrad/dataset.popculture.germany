# News outlets and press-release sources of the feeds collector.
#
# [[outlet]]: a news outlet. Items of an outlet with `focus` (a field of pop culture, see
#   schema.PopDomain) all count as pop culture; items of a general outlet pass if their feed or URL
#   names a culture, entertainment or lifestyle section or if they contain a pop culture term.
# [[press_source]]: an issuer of press releases; all its items pass.
# [[excluded]]: candidates that were checked and not admitted. blocked, tdm_reserved, terms,
#   duplicate and not_relevant are permanent; no_feed, inactive, robots and unchecked are checked
#   again by every source review, which can admit the candidate.
#
# Admission rules (see CLAUDE.md, section 8): robots.txt allows the feeds; no machine-readable TDM
# reservation; no bot protection; the terms or the imprint do not forbid the inclusion in databases,
# the automated collection of content or its transfer into a machine-readable form. A TDM reservation
# stated in natural language (robots.txt or imprint) sets fetch_pages = false, so that only feed data
# is used. Only titles, URLs and metadata are stored.
#
# The comment above each entry records the check: the time span covered by the items of each feed
# (h = hours) and the robots.txt and imprint findings. Ids are permanent; a source that is no longer
# collected keeps its entry with `removed` and `removed_reason`.

